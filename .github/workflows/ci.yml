# Runs the whole test suite on Linux, macOS, Windows and Windows on Arm for every push and pull request to main and to
# the migration branches (migrate/**, which includes migrate/deno-go). The release workflow calls it too
# (workflow_call), so a tag is only built when the suite passes.
# Actions are pinned by commit SHA (the comment names the release); Node is pinned to the exact version
# the single-file binaries embed. Update both together with release.yml.
# The deno job runs the same suite and the contract suite under the pinned Deno with the "test" permission set of
# deno.json (never -A), and blocks like the Node job (P2 T4). The Node job keeps running until the cut-over (P7).
# The build-deno job compiles and smoke-tests the six single-file binaries on native runners (P2 T6).
name: CI
on:
  push:
    branches: [main, 'migrate/**']
  pull_request:
    branches: [main, 'migrate/**']
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false # report every OS, not just the first failure
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    steps:
      # Windows runners convert line endings on checkout; keep LF so text fixtures read alike everywhere.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      # No npm install: the app and its tests have no runtime dependencies.
      - name: Test suite
        shell: bash
        run: |
          export ZAAFPULSE_DATA="$RUNNER_TEMP/zp-data" HOME="$RUNNER_TEMP/zp-home"
          mkdir -p "$ZAAFPULSE_DATA" "$HOME"
          node --test test/*.test.js
      # The gateway contract suite (test/contract/): server.js as a child process against a fake upstream, black-box.
      - name: Gateway contract suite
        shell: bash
        run: npm run test:contract
      - run: node bin/zaafpulse.js doctor
  deno:
    name: deno (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      DENO_DIR: ${{ github.workspace }}/../deno-dir # outside HOME, which the test step points at a temp folder
      NO_COLOR: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.8
      # Under Deno a script (the judge's fake Claude Code, an npm cli.js) runs through a real node found on PATH, and
      # discovery passes over a node others can write. The image's own node on ubuntu-latest is /usr/local/bin/node,
      # mode 0777 in a 0777 folder (measured), so the pinned node is put first on PATH, as in the Node job.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      # Installs exactly what deno.lock pins; fails when the lockfile is stale.
      - run: deno ci
      - name: Test suite under Deno
        shell: bash
        run: |
          export ZAAFPULSE_DATA="$RUNNER_TEMP/zp-data" HOME="$RUNNER_TEMP/zp-home"
          mkdir -p "$ZAAFPULSE_DATA" "$HOME"
          set +e
          deno test -q --no-check --no-prompt -P=test test/*.test.js > "$RUNNER_TEMP/deno-test.log" 2>&1
          code=$?
          set -e
          scripts/migration/deno-test-summary.sh "$RUNNER_TEMP/deno-test.log" "deno test (${{ matrix.os }})" \
            > "$RUNNER_TEMP/deno-summary.md"
          cat "$RUNNER_TEMP/deno-summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit $code
      # Runs even when the unit suite above failed, so both results are reported.
      - name: Gateway contract suite on the Deno server
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          # The "test" set: read anywhere, write and run unscoped (symlinks and fakes, see deno.json), net to this
          # machine only. The harness starts server.js under its own narrow set.
          ZP_RUNTIME=deno deno test -q --no-check --no-prompt -P=test test/contract/ > "$RUNNER_TEMP/deno-contract.log" 2>&1
          code=$?
          set -e
          scripts/migration/deno-test-summary.sh "$RUNNER_TEMP/deno-contract.log" "contract suite under Deno (${{ matrix.os }})" \
            | tee -a "$RUNNER_TEMP/deno-summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deno-test-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/deno-summary.md
            ${{ runner.temp }}/deno-test.log
            ${{ runner.temp }}/deno-contract.log
          if-no-files-found: warn

  typecheck:
    name: typecheck (deno check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.8
      - run: deno ci
      # lib/gateway, lib/cost and lib/governance with // @ts-check and tsconfig.json; @types/node is dev-only.
      - run: deno task typecheck

  # Compiles the six single-file binaries with deno compile and the "cli" permission set (the binary's entry is the
  # command line, so it holds the superset of the server set), and smoke-tests each one on a runner of its own OS and
  # CPU (P2 T6): start in demo mode on a throwaway data folder, /login.html 200, /api/platform
  # single-file on Deno, doctor. Pushes and release calls only, not pull requests. The denort base binary of each target
  # is cached (a download failed once in P1). Publishing is P6.
  build-deno:
    name: build-deno (${{ matrix.name }})
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { name: linux-arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { name: darwin-arm64, runner: macos-latest, target: aarch64-apple-darwin }
          - { name: darwin-x64, runner: macos-15-intel, target: x86_64-apple-darwin }
          - { name: win-x64, runner: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: win-arm64, runner: windows-11-arm, target: aarch64-pc-windows-msvc }
    env:
      DENO_DIR: ${{ github.workspace }}/../deno-dir
      NO_COLOR: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.8
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/../deno-dir/dl
          key: denort-2.9.8-${{ matrix.target }}
      - name: Build
        shell: bash
        run: deno task build --target ${{ matrix.target }}
      - name: Smoke test on this runner
        shell: bash
        run: |
          B="$(cd dist && ls zaafpulse-*-${{ matrix.name }}*)"
          deno run -q --no-prompt --allow-read --allow-write=dist --allow-net=127.0.0.1 --allow-run="dist/$B" \
            --allow-env=PATH,SystemRoot,SYSTEMROOT,PATHEXT,TEMP,TMP,windir,ComSpec --ignore-env \
            scripts/smoke-binary.js "dist/$B" | tee "$RUNNER_TEMP/smoke.json"
          echo "| ${{ matrix.name }} | $(cat "$RUNNER_TEMP/smoke.json") |" >> "$GITHUB_STEP_SUMMARY"
      - run: mv dist/SHA256SUMS.txt dist/SHA256SUMS-${{ matrix.name }}.txt
        shell: bash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zaafpulse-${{ matrix.name }}
          path: dist/zaafpulse-*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sha256-${{ matrix.name }}
          path: dist/SHA256SUMS-${{ matrix.name }}.txt
