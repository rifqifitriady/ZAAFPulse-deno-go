# GitHub secret scanning: paths whose secrets are test-only fixtures, never real credentials.
# - The provauth fixtures (P4g) carry a fixed RSA test key, generated once for that corpus. It must stay fixed: the
#   RS256 signature is deterministic and the fixtures compare it byte for byte between the JS and the Go code. The key
#   authenticates nothing; it is labelled in scripts/fixtures/gen-provauth.js.
paths-ignore:
  - 'gw/testdata/provauth/**'
  - 'scripts/fixtures/gen-provauth.js'
