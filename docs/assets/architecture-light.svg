<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="How ZAAFPulse v2 runs: the Go gateway zaafpulse-gw holds the main port and answers the route classes switched to go; the rest is forwarded to the Deno control plane zaafpulse on an internal port. The two talk over IPC v1 on the gateway's stdin and stdout. Outbound calls of the classes on go leave through the gateway's egress endpoint; the control plane is the only writer of the usage log, the cost ledger and the audit chain">
<style>.hd{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;font-weight:700;letter-spacing:3px;fill:#1f7f95}.pt{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;font-weight:700;fill:#0f1b2a}.ps{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;fill:#5f6f7e}.bt{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;font-weight:700;fill:#0f1b2a}.bs{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;fill:#5f6f7e}.lb{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;fill:#4b5a6a}.ft{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;fill:#4b5a6a}.box{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}.mv{stroke-dasharray:6 6;animation:flow 1.1s linear infinite}@keyframes flow{to{stroke-dashoffset:-24}}@keyframes rise{from{opacity:0;transform:translateY(10px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs>
<marker id="m-req" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker>
<marker id="m-ipc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker>
<marker id="m-egr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6250d6"/></marker>
<marker id="m-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa9b6"/></marker>
</defs>
<rect x=".5" y=".5" width="1199" height="799" rx="18" fill="#f8fbfd" stroke="#d3e0e8"/>
<text x="40" y="44" class="hd">CLIENTS</text>
<text x="680" y="44" class="hd">ON THIS MACHINE</text>
<g class="box" style="animation-delay:0.06s"><rect x="40" y="60" width="230" height="64" rx="12" fill="#ffffff" stroke="#d3e0e8"/><rect x="40" y="74" width="3.5" height="36" rx="1.75" fill="#2a78d6"/><text x="58" y="88" class="bt">Browser</text><text x="58" y="108" class="bs">the dashboard</text></g>
<g class="box" style="animation-delay:0.12s"><rect x="290" y="60" width="230" height="64" rx="12" fill="#ffffff" stroke="#d3e0e8"/><rect x="290" y="74" width="3.5" height="36" rx="1.75" fill="#2a78d6"/><text x="308" y="88" class="bt">Apps &amp; code tools</text><text x="308" y="108" class="bs">/v1 · /mcp · /a2a + API key</text></g>
<g class="box" style="animation-delay:0.18s"><rect x="680" y="60" width="480" height="64" rx="12" fill="#ffffff" stroke="#d3e0e8"/><rect x="680" y="74" width="3.5" height="36" rx="1.75" fill="#e87ba4"/><text x="698" y="88" class="bt">Your logs and settings</text><text x="698" y="108" class="bs">~/.claude · ~/.codex · config.json · .data/</text></g>
<rect x="40" y="166" width="480" height="414" rx="16" fill="#eef4f8" stroke="#1f7f95" stroke-width="1.5"/>
<text x="60" y="194" class="pt">zaafpulse-gw</text>
<text x="500" y="194" class="ps" text-anchor="end">Go · data plane</text>
<rect x="680" y="166" width="480" height="414" rx="16" fill="#eef4f8" stroke="#eb6834" stroke-width="1.5"/>
<text x="700" y="194" class="pt">zaafpulse</text>
<text x="1140" y="194" class="ps" text-anchor="end">Deno · control plane</text>
<g class="box" style="animation-delay:0.24s"><rect x="64" y="206" width="432" height="64" rx="12" fill="#ffffff" stroke="#d3e0e8"/><rect x="64" y="220" width="3.5" height="36" rx="1.75" fill="#2a78d6"/><text x="82" y="234" class="bt">Front · main port :4777</text><text x="82" y="254" class="bs">TLS · sorts each call into its route class</text></g>
<g class="box" style="animation-delay:0.30s"><rect x="64" y="296" width="432" height="64" rx="12" fill="#ffffff" stroke="#d3e0e8"/><rect x="64" y="310" width="3.5" height="36" rx="1.75" fill="#1f7f95"/><text x="82" y="324" class="bt">Engine · classes switched to go</text><text x="82" y="344" class="bs">keys · guardrails · translate · saver · routes</text></g>
<g class="box" style="animation-delay:0.36s"><rect x="64" y="386" width="432" height="64" rx="12" fill="#ffffff" stroke="#d3e0e8"/><rect x="64" y="400" width="3.5" height="36" rx="1.75" fill="#6250d6"/><text x="82" y="414" class="bt">Egress endpoint · 127.0.0.1</text><text x="82" y="434" class="bs">allow-list · every outbound call recorded</text></g>
<g class="box" style="animation-delay:0.42s"><rect x="64" y="476" width="432" height="64" rx="12" fill="#ffffff" stroke="#d3e0e8"/><rect x="64" y="490" width="3.5" height="36" rx="1.75" fill="#1baf7a"/><text x="82" y="504" class="bt">Durable outbox</text><text x="82" y="524" class="bs">usage · audit · spans · egress records</text></g>
<g class="box" style="animation-delay:0.48s"><rect x="704" y="206" width="432" height="64" rx="12" fill="#ffffff" stroke="#d3e0e8"/><rect x="704" y="220" width="3.5" height="36" rx="1.75" fill="#2a78d6"/><text x="722" y="234" class="bt">Internal port · 127.0.0.1</text><text x="722" y="254" class="bs">dashboard API · JS gateway (classes on js)</text></g>
<g class="box" style="animation-delay:0.54s"><rect x="704" y="296" width="432" height="64" rx="12" fill="#ffffff" stroke="#d3e0e8"/><rect x="704" y="310" width="3.5" height="36" rx="1.75" fill="#eb6834"/><text x="722" y="324" class="bt">Control plane</text><text x="722" y="344" class="bs">indexer · Cost Control · governance · agents</text></g>
<g class="box" style="animation-delay:0.60s"><rect x="704" y="386" width="432" height="64" rx="12" fill="#ffffff" stroke="#d3e0e8"/><rect x="704" y="400" width="3.5" height="36" rx="1.75" fill="#6250d6"/><text x="722" y="414" class="bt">Egress client</text><text x="722" y="434" class="bs">per caller class: direct · check · go</text></g>
<g class="box" style="animation-delay:0.66s"><rect x="704" y="476" width="432" height="64" rx="12" fill="#ffffff" stroke="#d3e0e8"/><rect x="704" y="490" width="3.5" height="36" rx="1.75" fill="#1baf7a"/><text x="722" y="504" class="bt">The only writer</text><text x="722" y="524" class="bs">usage log · cost ledger · audit chain</text></g>
<g class="box" style="animation-delay:0.72s"><rect x="40" y="652" width="1120" height="64" rx="12" fill="#ffffff" stroke="#d3e0e8"/><rect x="40" y="666" width="3.5" height="36" rx="1.75" fill="#eda100"/><text x="58" y="680" class="bt">Internet</text><text x="58" y="700" class="bs">LLM providers · integrations · price sync · webhooks · OTLP · remote agents</text></g>
<path d="M250,124 L250,206" fill="none" stroke="#2a78d6" stroke-width="1.6" class="mv" marker-end="url(#m-req)"/>
<path d="M320,124 L320,206" fill="none" stroke="#2a78d6" stroke-width="1.6" class="mv" marker-end="url(#m-req)"/>
<text x="332" y="150" class="lb" text-anchor="start">HTTP :4777</text>
<path d="M920,124 L920,166" fill="none" stroke="#9aa9b6" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#m-dim)"/>
<text x="932" y="150" class="lb" text-anchor="start">read</text>
<path d="M496,238 L704,238" fill="none" stroke="#2a78d6" stroke-width="1.6" class="mv" marker-end="url(#m-req)"/>
<text x="600" y="218" class="lb" text-anchor="middle">classes on js</text>
<text x="600" y="232" class="lb" text-anchor="middle">(signed client)</text>
<path d="M280,270 L280,296" fill="none" stroke="#2a78d6" stroke-width="1.6" class="mv" marker-end="url(#m-req)"/>
<text x="292" y="287" class="lb" text-anchor="start">classes on go</text>
<path d="M280,360 L280,386" fill="none" stroke="#6250d6" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#m-egr)"/>
<text x="292" y="377" class="lb" text-anchor="start">its provider calls</text>
<path d="M704,328 L496,328" fill="none" stroke="#1baf7a" stroke-width="2" marker-end="url(#m-ipc)"/>
<text x="600" y="308" class="lb" text-anchor="middle">IPC v1: config ·</text>
<text x="600" y="322" class="lb" text-anchor="middle">secrets · budgets</text>
<path d="M704,418 L496,418" fill="none" stroke="#6250d6" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#m-egr)"/>
<text x="600" y="398" class="lb" text-anchor="middle">outbound calls</text>
<text x="600" y="412" class="lb" text-anchor="middle">of classes on go</text>
<path d="M496,508 L704,508" fill="none" stroke="#1baf7a" stroke-width="2" marker-end="url(#m-ipc)"/>
<text x="600" y="488" class="lb" text-anchor="middle">IPC v1: records,</text>
<text x="600" y="502" class="lb" text-anchor="middle">acknowledged</text>
<text x="600" y="564" class="lb" text-anchor="middle">stdin · stdout</text>
<text x="600" y="578" class="lb" text-anchor="middle">one JSON per line</text>
<path d="M64,418 L52,418 L52,652" fill="none" stroke="#6250d6" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#m-egr)"/>
<path d="M1136,418 L1148,418 L1148,652" fill="none" stroke="#9aa9b6" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#m-dim)"/>
<text x="1136" y="612" class="lb" text-anchor="end">direct · check (the default)</text>
<text x="64" y="612" class="lb" text-anchor="start">through Go, recorded in .data/egress.jsonl</text>
<path d="M40,744 L68,744" stroke="#2a78d6" stroke-width="2" marker-end="url(#m-req)"/>
<text x="78" y="748" class="ft">a gateway call</text>
<path d="M212.8,744 L240.8,744" stroke="#1baf7a" stroke-width="2" marker-end="url(#m-ipc)"/>
<text x="250.8" y="748" class="ft">IPC v1 (stdin/stdout)</text>
<path d="M436.0,744 L464.0,744" stroke="#6250d6" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#m-egr)"/>
<text x="474.0" y="748" class="ft">outbound through Go</text>
<path d="M644.8,744 L672.8,744" stroke="#9aa9b6" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#m-dim)"/>
<text x="682.8" y="748" class="ft">direct, or read from disk</text>
<text x="40" y="778" class="ft">Default gateway.engine "js": no Go process, the control plane holds :4777 as in v1.1. Each route class and each egress class moves to Go by its own switch.</text>
</svg>
